# Local development database. Port 5433 on the host avoids clashing with any other Postgres.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: savora
      POSTGRES_PASSWORD: savora
      POSTGRES_DB: savora
    ports:
      - "5433:5432"
    volumes:
      - savora-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savora"]
      interval: 3s
      retries: 20
volumes:
  savora-db:
